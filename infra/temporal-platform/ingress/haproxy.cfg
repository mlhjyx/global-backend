# Backend-facing loopback ingress for the native Temporal frontend.
#
# Native Linux dockerd never maps a host port for a container whose only network
# is `internal`, so temporal-platform itself publishes nothing. This relay joins
# that internal network plus a bridge that cannot NAT traffic out, and forwards
# raw TCP to the frontend. It never terminates TLS and holds no certificate, key
# or token: hostname verification and JWT authorization stay end-to-end between
# each Backend client and temporal-platform:7233.
global
    nbthread 2
    maxconn 256
    log stderr format raw local0 notice

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    # Worker long polls and HTTP/2 keepalive must never be cut by idle timers.
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout client-fin 30s
    timeout server-fin 30s

# Docker's embedded resolver, so the relay follows temporal-platform across
# container recreation instead of pinning the address seen at startup.
resolvers docker-embedded
    parse-resolv-conf
    hold valid 10s

frontend temporal-platform-loopback
    bind :7233
    default_backend temporal-platform-frontend

backend temporal-platform-frontend
    server temporal-platform temporal-platform:7233 resolvers docker-embedded init-addr libc,none
