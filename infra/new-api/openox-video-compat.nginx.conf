worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    # Match the pinned new-api MAX_REQUEST_BODY_MB default.
    client_max_body_size 128m;

    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_ssl_server_name on;
    proxy_ssl_name openox.tech;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 2;
    proxy_set_header Host openox.tech;

    location = /healthz {
      return 204;
    }

    # The pinned new-api Sora adaptor emits this exact create path.
    location = /v1/videos {
      if ($request_method != POST) {
        return 405;
      }
      proxy_pass https://openox.tech/v1/video/generations;
    }

    # Preserve model discovery and /v1/videos/{task_id} polling byte-for-byte.
    location / {
      proxy_pass https://openox.tech;
    }
  }
}
