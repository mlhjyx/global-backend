# Managed development runtime. Supply GLOBAL_BACKEND_IMAGE as a repository
# reference pinned by digest (name@sha256:...). The same reference is passed into
# startup admission, which derives the digest suffix. Promotion never rebuilds it.
x-backend-environment: &backend-environment
  NODE_ENV: production
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
  RUNTIME_IMAGE_REFERENCE: ${GLOBAL_BACKEND_IMAGE}
  MACHINE_BOOTSTRAP_CA_FILE: /run/secrets/machine/bootstrap-ca.pem
  MACHINE_BOOTSTRAP_CERT_FILE: /run/secrets/machine/client-cert.pem
  MACHINE_BOOTSTRAP_KEY_FILE: /run/secrets/machine/client-key.pem
  TEMPORAL_TLS_CA_FILE: /run/secrets/machine/temporal-ca.pem
  SITE_BUILD_SETTLEMENT_DERIVATION_KEYRING_FILE: /run/secrets/site-build-settlement/derivation.keyring
  GENERIC_OPERATION_ARTIFACT_S3_ENDPOINT: ${GENERIC_OPERATION_ARTIFACT_S3_ENDPOINT:?set the artifact S3 endpoint}
  GENERIC_OPERATION_ARTIFACT_S3_BUCKET: ${GENERIC_OPERATION_ARTIFACT_S3_BUCKET:?set the artifact S3 bucket}
  GENERIC_OPERATION_ARTIFACT_S3_REGION: ${GENERIC_OPERATION_ARTIFACT_S3_REGION:-us-east-1}
  GENERIC_OPERATION_ARTIFACT_S3_ACCESS_KEY: ${GENERIC_OPERATION_ARTIFACT_S3_ACCESS_KEY:?set the artifact S3 access key}
  GENERIC_OPERATION_ARTIFACT_S3_SECRET_KEY: ${GENERIC_OPERATION_ARTIFACT_S3_SECRET_KEY:?set the artifact S3 secret key}
  GENERIC_OPERATION_ARTIFACT_S3_FORCE_PATH_STYLE: ${GENERIC_OPERATION_ARTIFACT_S3_FORCE_PATH_STYLE:-false}

x-backend-runtime: &backend-runtime
  profiles: [managed-runtime]
  image: ${GLOBAL_BACKEND_IMAGE:?set GLOBAL_BACKEND_IMAGE to name@sha256:digest}
  user: "10001:10001"
  init: true
  env_file:
    - .secrets/backend-runtime.env
  environment: *backend-environment
  network_mode: host
  read_only: true
  volumes:
    - type: bind
      source: ${SITE_BUILD_SETTLEMENT_SECRET_DIRECTORY:-./.secrets/site-build-settlement}
      target: /run/secrets/site-build-settlement
      read_only: true
      bind:
        create_host_path: false
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  mem_limit: ${GLOBAL_BACKEND_MEMORY_LIMIT:-4g}
  cpus: ${GLOBAL_BACKEND_CPU_LIMIT:-2.0}
  ulimits:
    nofile:
      soft: 1024
      hard: 1024
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=2g,uid=10001,gid=10001
    - /home/global/.cache:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-bootstrap:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 90s

services:
  api:
    <<: *backend-runtime
    container_name: global-api
    env_file:
      - .secrets/backend-runtime.env
      - .secrets/backend-api-runtime.env
    command: ["api"]
    environment:
      <<: *backend-environment
      PLATFORM_CAPABILITY_CA_FILE: /run/secrets/machine/capability-ca.pem
    volumes:
      - type: bind
        source: ${SITE_BUILD_SETTLEMENT_SECRET_DIRECTORY:-./.secrets/site-build-settlement}
        target: /run/secrets/site-build-settlement
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${API_MACHINE_SECRET_DIRECTORY:?set the API-only machine credential directory}
        target: /run/secrets/machine
        read_only: true
        bind: { create_host_path: false }

  worker:
    <<: *backend-runtime
    container_name: global-worker
    env_file:
      - .secrets/backend-runtime.env
      - .secrets/backend-worker-runtime.env
    environment:
      <<: *backend-environment
      GENERIC_OPERATION_ARTIFACT_CLEANUP_S3_ACCESS_KEY: ${GENERIC_OPERATION_ARTIFACT_CLEANUP_S3_ACCESS_KEY:?set the personal artifact cleanup S3 access key}
      GENERIC_OPERATION_ARTIFACT_CLEANUP_S3_SECRET_KEY: ${GENERIC_OPERATION_ARTIFACT_CLEANUP_S3_SECRET_KEY:?set the personal artifact cleanup S3 secret key}
    command: ["customer-worker"]
    volumes:
      - type: bind
        source: ${SITE_BUILD_SETTLEMENT_SECRET_DIRECTORY:-./.secrets/site-build-settlement}
        target: /run/secrets/site-build-settlement
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CUSTOMER_WORKER_MACHINE_SECRET_DIRECTORY:?set the customer-worker-only machine credential directory}
        target: /run/secrets/machine
        read_only: true
        bind: { create_host_path: false }

  platform-worker:
    <<: *backend-runtime
    container_name: global-platform-worker
    env_file:
      - .secrets/backend-platform-worker-runtime.env
    environment:
      NODE_ENV: production
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      RUNTIME_IMAGE_REFERENCE: ${GLOBAL_BACKEND_IMAGE}
      MACHINE_BOOTSTRAP_CA_FILE: /run/secrets/machine/bootstrap-ca.pem
      MACHINE_BOOTSTRAP_CERT_FILE: /run/secrets/machine/client-cert.pem
      MACHINE_BOOTSTRAP_KEY_FILE: /run/secrets/machine/client-key.pem
      TEMPORAL_TLS_CA_FILE: /run/secrets/machine/temporal-ca.pem
      PLATFORM_CAPABILITY_CA_FILE: /run/secrets/machine/capability-ca.pem
    command: ["platform-worker"]
    volumes:
      - type: bind
        source: ${PLATFORM_WORKER_MACHINE_SECRET_DIRECTORY:?set the platform-worker-only machine credential directory}
        target: /run/secrets/machine
        read_only: true
        bind: { create_host_path: false }
