# Optional Langfuse v4 development stack. This file is intentionally separate
# from the default Compose graph: ordinary `pnpm infra:up` must not allocate the
# observability stack or require its secrets.
x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: http://localhost:3002
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_ACCESS_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_SECRET_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_OBSERVATION_FIELD_OVERFLOW_ENABLED: "false"
  LANGFUSE_API_TRACES_DEFAULT_FIELDS: core
  LANGFUSE_API_TRACES_DEFAULT_DATE_RANGE_DAYS: "30"

x-langfuse-depends-on: &langfuse-depends-on
  langfuse-postgres:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

services:
  langfuse-worker:
    profiles: [ai-observability]
    image: docker.io/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG}
    container_name: global-langfuse-worker
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment: *langfuse-environment
    networks: [ai-observability]

  langfuse-web:
    profiles: [ai-observability]
    image: docker.io/langfuse/langfuse:${LANGFUSE_IMAGE_TAG}
    container_name: global-langfuse-web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_PROJECT_RETENTION: "30"
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    networks: [ai-observability]

  langfuse-clickhouse:
    profiles: [ai-observability]
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: global-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ai-observability]

  langfuse-redis:
    profiles: [ai-observability]
    image: docker.io/redis:7-alpine
    container_name: global-langfuse-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_AUTH}\" ping | grep -q PONG"]
      interval: 3s
      timeout: 10s
      retries: 20
    networks: [ai-observability]

  langfuse-postgres:
    profiles: [ai-observability]
    image: docker.io/postgres:17-alpine
    container_name: global-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [ai-observability]

  langfuse-minio:
    profiles: [ai-observability]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: global-langfuse-minio
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9092:9000"
      - "127.0.0.1:9093:9001"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [ai-observability]

  langfuse-minio-init:
    profiles: [ai-observability]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: global-langfuse-minio-init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://langfuse-minio:9000 "${LANGFUSE_MINIO_ACCESS_KEY}" "${LANGFUSE_MINIO_SECRET_KEY}";
        mc mb --ignore-existing local/langfuse-events;
        mc mb --ignore-existing local/langfuse-media
    restart: "no"
    networks: [ai-observability]

volumes:
  langfuse-postgres-data:
  langfuse-redis-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:

networks:
  ai-observability:
    internal: true
