version: 2
# 依赖更新（团队后端安全基线）。npm 生态覆盖 pnpm-lock.yaml。
#
# 只保留安全更新：open-pull-requests-limit: 0 关闭版本更新 PR，不影响安全更新
# （GitHub 为安全更新单独计数）。原因：依赖或 action 变动必然触发 Copy fixed-source
# 指纹与 required-contexts 的 action pin，Dependabot 无法自行更新二者，版本更新 PR
# 结构性必挂（76 个中 56 个未合即关）。常规升级改为每月一次批量 PR，并在漏洞基线
# valid_until 之前完成；安全更新 PR 由开发代理补一次重签后合入。流程见
# docs/backend/dependency-refresh.md。下方分组仍决定安全更新的打包方式与批量升级的分域。
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # Domain groups are ordered from specific to fallback. Non-ignored major
      # updates stay outside these groups and remain individually reviewable;
      # explicit major ignores below are tracked as manual migration projects.
      nestjs-runtime:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
          - "class-transformer"
          - "class-validator"
          - "reflect-metadata"
          - "rxjs"
        update-types: [minor, patch]
      temporal-runtime:
        applies-to: version-updates
        patterns:
          - "@temporalio/*"
        update-types: [minor, patch]
      site-renderer:
        applies-to: version-updates
        patterns:
          - "astro"
          - "@astrojs/*"
          - "@fontsource/*"
          - "@fontsource-variable/*"
          - "@playwright/*"
          - "playwright"
          - "axe-core"
          - "chrome-launcher"
          - "lighthouse"
          - "sharp"
          - "vite"
          - "vitest"
        update-types: [minor, patch]
      observability-runtime:
        applies-to: version-updates
        patterns:
          - "@langfuse/*"
          - "@opentelemetry/*"
          - "@sentry/*"
        update-types: [minor, patch]
      data-infrastructure:
        applies-to: version-updates
        patterns:
          - "@aws-sdk/*"
          - "@google-cloud/*"
          - "@prisma/*"
          - "prisma"
          - "ioredis"
          - "minio"
          - "pg"
        update-types: [minor, patch]
      ai-model-runtime:
        applies-to: version-updates
        patterns:
          - "@ai-sdk/*"
          - "ai"
        update-types: [minor, patch]
      contracts-tooling:
        applies-to: version-updates
        patterns:
          - "@redocly/*"
          - "@stoplight/*"
          - "ajv"
          - "ajv-formats"
          - "openapi-typescript"
          - "zod"
        update-types: [minor, patch]
      development-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      production-runtime:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      production-security:
        applies-to: security-updates
        dependency-type: production
        patterns: ["*"]
      development-security:
        applies-to: security-updates
        dependency-type: development
        patterns: ["*"]
    # 这些大版本必须按运行时/框架迁移项目处理，不能由单包 PR 直接推进。
    ignore:
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      # NestJS majors must move as one compatibility-reviewed migration; a
      # standalone package bump can leave the framework toolchain split.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # v5 changes parser behavior/API and needs fixture-based regression review.
      - dependency-name: "fast-xml-parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # action 升级还须同步 .github/required-contexts.json 的精确 pin，随每月批量处理
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
