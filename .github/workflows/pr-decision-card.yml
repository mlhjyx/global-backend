name: PR decision card

# 安全边界：pull_request_target 只执行 default branch 的受信脚本，并明确
# checkout base SHA；不得 checkout 或执行 PR head。PR 正文按不可信数据解析。
on:
  pull_request_target:
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
      ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-decision-card-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decision-card:
    name: nontechnical decision card freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Render current decision card
        run: >-
          node scripts/pr-decision-card.mjs render
          --event "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/pr-decision-card.md"
          --result "$RUNNER_TEMP/pr-decision-card-result.json"

      - name: Create or update the bot-owned card
        uses: actions/github-script@v8
        env:
          CARD_PATH: ${{ runner.temp }}/pr-decision-card.md
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(process.env.CARD_PATH, "utf8");
            const marker = "<!-- codex-nontechnical-decision-card:v1 -->";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Reject a stale MERGE recommendation
        run: >-
          node scripts/pr-decision-card.mjs check
          --result "$RUNNER_TEMP/pr-decision-card-result.json"
