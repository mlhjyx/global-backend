name: CI

# 每个 PR 与 main 推送自动跑：install → prisma generate → build(=tsc 类型检查) → test(vitest)。
# 55 型三断点视觉回归仅在渲染输出、其消费的契约或本工作流变更时运行；
# 每日 03:17 UTC（11:17 中国标准时间）定时与手动触发始终跑全量视觉门，避免路径过滤遗漏或运行器漂移长期未被发现。
# 绿了才合。普通API测试仍是纯单测；运行身份权限另使用一次性 PostgreSQL 验证真实数据库授权。
# 真源/provider调用仍走受控验证（见 AGENTS.md §5），不进入CI。
# contracts job（收口④）：openapi.json 单一真值三道门——drift（契约=代码）+ spectral lint + oasdiff breaking。
# pull_request 加 labeled/unlabeled：打/摘 `breaking-change-approved` label 要重估 breaking 门。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled full visual baseline must not cancel a main push verification
  # (or vice versa). Synchronizations of the same PR still cancel stale runs.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-visual-scope:
    name: renderer visual scope
    runs-on: ubuntu-latest
    outputs:
      run_visual: ${{ steps.scope.outputs.run_visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        name: Detect renderer visual-regression inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Scheduled/manual runs are the periodic full baseline. If a usable
          # diff base is unavailable, execute rather than silently skipping.
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]] ||
            [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run_visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scope_paths="$RUNNER_TEMP/renderer-visual-scope-paths.txt"
          if ! git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$scope_paths"; then
            echo "run_visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r -d '' path; do
            case "$path" in
              apps/site-renderer/* | \
              packages/contracts/src/index.ts | \
              packages/contracts/package.json | \
              packages/contracts/tsconfig*.json | \
              packages/contracts/src/site-builder/* | \
              tsconfig.base.json | \
              package.json | pnpm-lock.yaml | pnpm-workspace.yaml | \
              .github/workflows/ci.yml)
                echo "run_visual=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < "$scope_paths"

          echo "run_visual=false" >> "$GITHUB_OUTPUT"

  build-test:
    name: build · typecheck · test
    needs: renderer-visual-scope
    if: always()
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: global
          POSTGRES_PASSWORD: global-test-only
          POSTGRES_DB: global_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U global -d global_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Fail closed when renderer scope evaluation did not succeed
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.renderer-visual-scope.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "::error::renderer visual scope did not succeed: $SCOPE_RESULT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # pnpm 版本读 package.json 的 packageManager 字段（pnpm@9.15.9）
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22 # engines: node>=20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Docs governance（structure · links · status · evidence）
        run: pnpm docs:verify

      - name: Memory control transaction tests
        run: pnpm memory:test

      - name: Nontechnical PR decision card tests
        run: pnpm decision-card:test

      - name: ContractGraph extractor tests and deterministic full-repository gate
        run: |
          pnpm code-intelligence:test
          pnpm code-intelligence:check

      - name: Prisma generate（build/test 依赖 @prisma/client 类型）
        run: pnpm --filter @global/db generate

      - name: Runtime lease principal PostgreSQL permissions
        shell: bash
        env:
          DATABASE_URL: postgresql://global:global-test-only@127.0.0.1:5432/global_test
          APP_DATABASE_URL: postgresql://app_user:app_pw@127.0.0.1:5432/global_test
        run: |
          set -euo pipefail
          pnpm --filter @global/db exec prisma migrate deploy
          export RUNTIME_LEASE_PROVISION_DATABASE_URL="${DATABASE_URL}"
          export RUNTIME_API_LEASE_LOGIN=ci_runtime_api
          export RUNTIME_WORKER_LEASE_LOGIN=ci_runtime_worker
          export RUNTIME_OUTBOX_RELAY_LEASE_LOGIN=ci_runtime_outbox_relay
          export RUNTIME_API_LEASE_PASSWORD="$(openssl rand -hex 24)"
          export RUNTIME_WORKER_LEASE_PASSWORD="$(openssl rand -hex 24)"
          export RUNTIME_OUTBOX_RELAY_LEASE_PASSWORD="$(openssl rand -hex 24)"
          export RUNTIME_API_LEASE_DATABASE_URL="postgresql://${RUNTIME_API_LEASE_LOGIN}:${RUNTIME_API_LEASE_PASSWORD}@127.0.0.1:5432/global_test"
          export RUNTIME_WORKER_LEASE_DATABASE_URL="postgresql://${RUNTIME_WORKER_LEASE_LOGIN}:${RUNTIME_WORKER_LEASE_PASSWORD}@127.0.0.1:5432/global_test"
          export RUNTIME_OUTBOX_RELAY_LEASE_DATABASE_URL="postgresql://${RUNTIME_OUTBOX_RELAY_LEASE_LOGIN}:${RUNTIME_OUTBOX_RELAY_LEASE_PASSWORD}@127.0.0.1:5432/global_test"
          bash infra/postgres/provision-runtime-lease-principals.sh
          bash infra/postgres/verify-runtime-lease-principal-permissions.sh
          pnpm exec tsx apps/api/scripts/verify-runtime-lease-prisma-compatibility.mts
          EXPECT_APP_DATABASE_READINESS=ready \
            pnpm exec tsx apps/api/scripts/verify-app-database-principal.mts
          restore_app_role() {
            psql "${DATABASE_URL}" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
              --command 'ALTER ROLE app_user NOBYPASSRLS;' >/dev/null
          }
          trap restore_app_role EXIT
          psql "${DATABASE_URL}" --no-psqlrc --set ON_ERROR_STOP=1 --quiet \
            --command 'ALTER ROLE app_user BYPASSRLS;' >/dev/null
          EXPECT_APP_DATABASE_READINESS=DATABASE_PRINCIPAL_INVALID \
            pnpm exec tsx apps/api/scripts/verify-app-database-principal.mts
          restore_app_role
          trap - EXIT

      - name: Lint（eslint flat config，typescript-eslint）
        run: pnpm --filter @global/api lint

      - name: Build 契约包（@global/api 依赖其 dist d.ts，DQ-1）
        run: pnpm --filter @global/contracts build

      - name: Build（nest build = tsc 全量类型检查）
        run: pnpm --filter @global/api build

      - name: Test（vitest 纯单测）
        run: pnpm --filter @global/api test

      - name: Site Builder isolated zero-dispatch evaluation boundary
        run: pnpm --filter @global/site-builder-eval-runner test

      - name: Evaluate Copy fixed-source impact
        id: copy-impact
        run: node scripts/copy-fixed-source-impact.mjs --github-output "$GITHUB_OUTPUT"

      - name: Copy Sonnet recovery fixed-source rebuild（顺序隔离）
        if: steps.copy-impact.outputs.status == 'CURRENT'
        run: >-
          COPY_SONNET_RECOVERY_MANIFEST_REBUILD_TEST=1
          COPY_SONNET_RECOVERY_REBUILD_TEST=1
          pnpm --filter @global/api exec vitest run
          src/site-builder/eval/copy-sonnet-recovery-manifest-prep.spec.ts
          src/site-builder/eval/copy-sonnet-recovery-runtime-binding-prep.spec.ts

      - name: Generate and verify API build attestation
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          export BUILT_AT
          RENDERER_RUNTIME="${RUNNER_TEMP}/site-renderer-runtime"
          DEPENDENCY_INVENTORY="${RUNNER_TEMP}/runtime-production-dependencies.json"
          node scripts/prepare-site-renderer-runtime.mjs apps/site-renderer "${RENDERER_RUNTIME}"
          node scripts/verify-runtime-artifact.mjs "${RENDERER_RUNTIME}"
          pnpm --filter @global/api --filter @global/site-renderer list --prod --depth Infinity --json > "${DEPENDENCY_INVENTORY}"
          node scripts/generate-runtime-sbom.mjs \
            "${DEPENDENCY_INVENTORY}" "${BUILD_SHA}" "${BUILT_AT}" \
            apps/api/dist/runtime-sbom.cdx.json @global/contracts@0.0.1
          node scripts/generate-runtime-artifact-manifest.mjs \
            --build-sha "${BUILD_SHA}" \
            --built-at "${BUILT_AT}" \
            --api apps/api/dist \
            --contracts packages/contracts/dist \
            --renderer "${RENDERER_RUNTIME}" \
            --sbom apps/api/dist/runtime-sbom.cdx.json \
            --source api-source=apps/api/src \
            --source contracts-source=packages/contracts/src \
            --source database-contract=packages/db/prisma \
            --source renderer-source="${RENDERER_RUNTIME}" \
            --output apps/api/dist/artifact-manifest.json
          node scripts/verify-runtime-artifact.mjs apps/api/dist
          pnpm exec tsx apps/api/scripts/generate-build-attestation.mts

      - name: Build and inspect immutable OCI runtime
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
          OCI_IMAGE: global-backend-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          export BUILT_AT
          docker build \
            --build-arg "BUILD_SHA=${BUILD_SHA}" \
            --build-arg "BUILT_AT=${BUILT_AT}" \
            --tag "${OCI_IMAGE}" \
            .
          test "$(docker image inspect --format '{{.Config.User}}' "${OCI_IMAGE}")" = global
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${OCI_IMAGE}")" = '["node","/app/runtime-entrypoint.mjs"]'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${OCI_IMAGE}")" = "${BUILD_SHA}"
          ARTIFACT_DIR="$(mktemp -d)"
          CONTAINER_ID="$(docker create "${OCI_IMAGE}" api)"
          cleanup() {
            docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true
            rm -rf "${ARTIFACT_DIR}"
          }
          trap cleanup EXIT
          mkdir "${ARTIFACT_DIR}/api-dist"
          docker cp "${CONTAINER_ID}:/app/apps/api/dist/." "${ARTIFACT_DIR}/api-dist"
          node scripts/verify-runtime-artifact.mjs "${ARTIFACT_DIR}/api-dist"
          docker run --rm --network none --entrypoint node "${OCI_IMAGE}" \
            /app/runtime-image-verifier.mjs /app
          docker run --rm --network none --entrypoint openssl "${OCI_IMAGE}" version
          docker run --rm --network none --entrypoint /usr/bin/chromium "${OCI_IMAGE}" \
            --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --disable-component-update \
            --no-first-run --no-default-browser-check --dump-dom \
            'data:text/html,<title>oci-browser-smoke</title>'
              docker run --rm --network none \
                --env "EXPECTED_BUILD_SHA=${BUILD_SHA}" \
                --entrypoint node "${OCI_IMAGE}" -e \
                'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync("/app/apps/api/dist/build-attestation.json","utf8"));if(a.build_sha!==process.env.EXPECTED_BUILD_SHA)process.exit(1)'

      - name: Worker fail-closed runtime smoke
        shell: bash
        env:
          OCI_IMAGE: global-backend-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          WORKER_LOG="$(mktemp)"
          cleanup_worker_smoke() {
            rm -f "${WORKER_LOG}"
          }
          trap cleanup_worker_smoke EXIT
          LOCAL_IMAGE_DIGEST="$(docker image inspect --format '{{.Id}}' "${OCI_IMAGE}")"
          RUNTIME_IMAGE_REFERENCE="global-backend-ci@${LOCAL_IMAGE_DIGEST}"
          set +e
          timeout --signal=TERM --kill-after=5s 10s \
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001 \
              --tmpfs /home/global/.cache:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
              --env NODE_ENV=production \
              --env APP_ENVIRONMENT=development \
              --env "RUNTIME_IMAGE_REFERENCE=${RUNTIME_IMAGE_REFERENCE}" \
              "${OCI_IMAGE}" worker >"${WORKER_LOG}" 2>&1
          WORKER_STATUS=$?
          set -e
          if [[ "${WORKER_STATUS}" -eq 0 ]]; then
            cat "${WORKER_LOG}"
            echo "::error::worker diagnostic smoke exited instead of holding fail-closed"
            exit 1
          fi
          grep -F 'Temporal polling remains disabled' "${WORKER_LOG}"
          if grep -Fq 'understanding worker up' "${WORKER_LOG}"; then
            cat "${WORKER_LOG}"
            echo "::error::unready Worker began Temporal polling"
            exit 1
          fi

      - name: Renderer read-only OCI smoke
        shell: bash
        env:
          OCI_IMAGE: global-backend-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001 \
            --tmpfs /home/global/.cache:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            --mount type=bind,src="${GITHUB_WORKSPACE}/apps/site-renderer/fixtures/demo-spec.json",dst=/run/renderer-demo-spec.json,readonly \
            --entrypoint node "${OCI_IMAGE}" -e '
              const fs=require("node:fs");
              const renderer=require("/app/apps/api/dist/site-builder/renderer-build.js");
              const spec=JSON.parse(fs.readFileSync("/run/renderer-demo-spec.json","utf8"));
              (async()=>{
                await renderer.buildSiteSpecWithTemporaryFile(spec,{outDir:"/tmp/rendered",basePath:"/",siteOrigin:"http://127.0.0.1"});
                const leaked=fs.readdirSync("/tmp").filter((name)=>name.startsWith("global-site-renderer-"));
                if(leaked.length)throw new Error("renderer build workspace leaked");
                for(const target of ["/app/apps/site-renderer/node_modules/.vite","/app/apps/site-renderer/.astro"]){
                  if(fs.existsSync(target))throw new Error(`read-only renderer mutated ${target}`);
                }
              })().catch((error)=>{console.error(error);process.exit(1)});'

      - name: Renderer contract tests
        run: pnpm --filter @global/site-renderer test:contracts

      - name: Renderer fixture Astro build matrix
        if: needs.renderer-visual-scope.outputs.run_visual == 'true'
        run: pnpm --filter @global/site-renderer test:fixtures

      - name: Renderer qualified component visual regression（375 · 768 · 1440）
        if: needs.renderer-visual-scope.outputs.run_visual == 'true'
        run: pnpm --filter @global/site-renderer test:visual

      - name: Renderer multilingual smoke build
        if: needs.renderer-visual-scope.outputs.run_visual == 'true'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const renderer = require('./apps/api/dist/site-builder/renderer-build.js');
          const spec = JSON.parse(fs.readFileSync('./apps/site-renderer/fixtures/multilingual-spec.json', 'utf8'));
          const outDir = process.env.RUNNER_TEMP + '/site-renderer-multilingual';
          fs.mkdirSync(outDir, { recursive: true });
          renderer.buildSiteSpecWithTemporaryFile(spec, {
            outDir,
            basePath: '/',
            siteOrigin: 'https://preview.example.test',
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

  contracts:
    name: contracts · drift · lint · breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @global/db generate

      - name: Build 契约包（@global/api 依赖其 dist d.ts，DQ-1）
        run: pnpm --filter @global/contracts build

      - name: Build API
        run: pnpm --filter @global/api build

      # 导出不连任何服务：test-process只生成code-first schema；没有开发token或产品依赖旁路。
      - name: Export OpenAPI（code-first 单一真值）
        run: node apps/api/dist/main.js --export-openapi
        env:
          NODE_ENV: test
          APP_ENVIRONMENT: test
          API_BIND_HOST: 127.0.0.1
          DATA_PROCESSOR_JURISDICTION: EU

      # git status --porcelain 同时抓「有 diff」与「文件未被跟踪/被删除」（git diff 对 untracked 视而不见）
      - name: Drift check（提交的 openapi.json 必须与代码一致且被跟踪）
        run: |
          if [ -n "$(git status --porcelain -- packages/contracts/openapi/openapi.json)" ]; then
            git status --porcelain -- packages/contracts/openapi/openapi.json
            git diff -- packages/contracts/openapi/openapi.json | head -100
            echo "::error::openapi.json 与代码不一致（或未被 git 跟踪）——本地重导出后提交"
            exit 1
          fi

      - name: Spectral lint（error 级即失败）
        run: pnpm --filter @global/contracts lint

      # 破坏性变更拦截：对比 PR base 分支契约。确需破坏 → PR 打 `breaking-change-approved`
      # label 放行（升主版本 + 迁移说明，见 packages/contracts/README.md）。
      - name: Fetch base contract（仅 PR）
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if git show "origin/$GITHUB_BASE_REF:packages/contracts/openapi/openapi.json" > base-openapi.json 2>/dev/null; then
            echo "HAS_BASE=1" >> "$GITHUB_ENV"
          else
            echo "base 分支无契约文件，跳过 breaking 检查"
          fi

      - name: oasdiff breaking（PR 且未标 breaking-change-approved）
        if: >-
          github.event_name == 'pull_request' &&
          env.HAS_BASE == '1' &&
          !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved')
        uses: oasdiff/oasdiff-action/breaking@2649ebe137aeb72a95707671204e829f86e091fc # v0.1.13
        env:
          OASDIFF_INTERNAL: "1"
        with:
          base: base-openapi.json
          revision: packages/contracts/openapi/openapi.json
          fail-on: ERR
          # 私有契约不外发：v0.1.6 默认 review:true 会把 spec 上传 oasdiff.com 并发 PR 评论
          review: "false"
