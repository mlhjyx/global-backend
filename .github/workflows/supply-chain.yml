name: Supply Chain Canary

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-canary-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review · canary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable runtime dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime

  production-audit-delta:
    name: production dependency delta · canary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history for trusted-base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Prove the pull request dependency graph delta
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_VERIFIER: ${{ runner.temp }}/supply-chain-audit.mjs
          TRUSTED_SOURCE_POLICY: ${{ runner.temp }}/supply-chain-source-policy.mjs
          TRUSTED_BASE_WORKTREE: ${{ runner.temp }}/trusted-pr-base
          BOOTSTRAP_DIFF: ${{ runner.temp }}/supply-chain-bootstrap-paths.txt
        run: |
          set -euo pipefail
          git show "$PR_BASE_SHA:scripts/supply-chain-source-policy.mjs" > "$TRUSTED_SOURCE_POLICY"
          node "$TRUSTED_SOURCE_POLICY" validate-sources --repository-root "$GITHUB_WORKSPACE"
          git worktree add --detach "$TRUSTED_BASE_WORKTREE" "$PR_BASE_SHA"
          node "$TRUSTED_SOURCE_POLICY" validate-sources --repository-root "$TRUSTED_BASE_WORKTREE"

          if git show "$PR_BASE_SHA:scripts/supply-chain-audit.mjs" | grep -Fq "DEPENDENCY_GRAPH_COMPARABLE_AUDIT_PROTOCOL"; then
            git show "$PR_BASE_SHA:scripts/supply-chain-audit.mjs" > "$TRUSTED_VERIFIER"
          else
            # A self-hosting protocol bootstrap is admitted only when it cannot
            # change dependency inputs and changes no files beyond this narrow
            # workflow/verifier/test boundary. Once merged, every PR uses a
            # verifier supplied by its trusted base.
            git diff --no-renames --name-only -z "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$BOOTSTRAP_DIFF"
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/supply-chain.yml | scripts/supply-chain-audit.mjs | scripts/supply-chain-gates.spec.mjs) ;;
                *)
                  echo "::error::dependency-delta protocol bootstrap changed an untrusted path: $path"
                  exit 1
                  ;;
              esac
            done < "$BOOTSTRAP_DIFF"
            cp scripts/supply-chain-audit.mjs "$TRUSTED_VERIFIER"
          fi

          node "$TRUSTED_SOURCE_POLICY" validate-sources --repository-root "$GITHUB_WORKSPACE"
          install_trusted_production_dependencies() {
            local target_root="$1"
            (
              cd "$target_root"
              env -i \
                HOME="$HOME" \
                PATH="$PATH" \
                CI=true \
                NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
                NPM_CONFIG_USERCONFIG=/dev/null \
                NPM_CONFIG_GLOBALCONFIG=/dev/null \
                NPM_CONFIG_IGNORE_PNPMFILE=true \
                NPM_CONFIG_IGNORE_SCRIPTS=true \
                pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --registry=https://registry.npmjs.org
            )
          }
          install_trusted_production_dependencies "$TRUSTED_BASE_WORKTREE"
          install_trusted_production_dependencies "$GITHUB_WORKSPACE"
          if git diff --quiet "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
            package.json ':(glob)**/package.json' \
            pnpm-lock.yaml pnpm-workspace.yaml \
            .npmrc ':(glob)**/.npmrc' \
            .pnpmfile.cjs ':(glob)**/.pnpmfile.cjs' \
            "patches/*"; then
            relation=IDENTICAL_TO_TRUSTED_BASE
          else
            relation=CHANGED
          fi
          node "$TRUSTED_VERIFIER" graph-delta \
            --trusted-base "$PR_BASE_SHA" \
            --candidate "$PR_HEAD_SHA" \
            --relation "$relation" \
            --trusted-base-root "$TRUSTED_BASE_WORKTREE" \
            --candidate-root "$GITHUB_WORKSPACE"

  baseline-freshness:
    name: production advisory baseline freshness · canary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Audit current main and emit a baseline-freshness receipt
        shell: bash
        env:
          AUDIT_FILE: ${{ runner.temp }}/production-dependency-audit.json
          BASELINE_PATH: docs/security/production-dependency-audit-baseline.json
        run: |
          set -euo pipefail
          node scripts/supply-chain-source-policy.mjs validate-sources --repository-root "$GITHUB_WORKSPACE"
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            CI=true \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            NPM_CONFIG_USERCONFIG=/dev/null \
            NPM_CONFIG_GLOBALCONFIG=/dev/null \
            NPM_CONFIG_IGNORE_PNPMFILE=true \
            NPM_CONFIG_IGNORE_SCRIPTS=true \
            pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --registry=https://registry.npmjs.org
          set +e
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            CI=true \
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ \
            NPM_CONFIG_USERCONFIG=/dev/null \
            NPM_CONFIG_GLOBALCONFIG=/dev/null \
            NPM_CONFIG_IGNORE_PNPMFILE=true \
            NPM_CONFIG_IGNORE_SCRIPTS=true \
            pnpm audit --prod --registry=https://registry.npmjs.org --json > "$AUDIT_FILE"
          audit_status=$?
          set -e
          if [[ "$audit_status" -ne 0 && "$audit_status" -ne 1 ]]; then
            echo "::error::current main production audit did not complete"
            exit 1
          fi
          node scripts/supply-chain-audit.mjs baseline-freshness \
            --baseline "$BASELINE_PATH" \
            --audit-file "$AUDIT_FILE" \
            --subject-commit "$GITHUB_SHA" \
            --lockfile-digest "sha256:$(sha256sum pnpm-lock.yaml | awk '{print $1}')" \
            --verifier-digest "sha256:$(sha256sum scripts/supply-chain-audit.mjs | awk '{print $1}')" \
            --source-policy-digest "sha256:$(sha256sum scripts/supply-chain-source-policy.mjs | awk '{print $1}')" \
            --audit-digest "sha256:$(sha256sum "$AUDIT_FILE" | awk '{print $1}')" \
            --observed-at "$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
